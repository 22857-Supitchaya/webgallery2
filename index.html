<!-- MUSIC PLAYER -->

<div class="music-player" id="musicPlayer">

    <div class="music-icon">
        🎵
    </div>

    <div class="music-info">

        <div class="music-label">
            NOW PLAYING
        </div>

        <div class="music-title">
            Play Date
        </div>

    </div>

    <button
        class="music-toggle"
        id="musicToggle"
        type="button"
        aria-label="Play music"
    >
        ▶
    </button>

    <audio
        id="bgMusic"
        preload="metadata"
    >

        <source
            src="./play-date.mp3"
            type="audio/mpeg"
        >

        เบราว์เซอร์ไม่รองรับการเล่นเพลง

    </audio>

</div>
