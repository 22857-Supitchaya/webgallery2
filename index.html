<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kim Dokja | Sweet Fantasy Story</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           ROOT COLORS
        ===================================================== */

        :root {

            --bg-a: #fff1f8;

            --bg-b: #f0e4ff;

            --bg-c: #def9ff;

            --accent-1: #ff79bf;

            --accent-2: #a98cff;

            --accent-3: #6fdff4;

            --accent-soft:
                rgba(255, 130, 194, 0.24);

            --text-main: #57385b;

            --text-soft: #7d637f;

            --glass:
                rgba(255, 255, 255, .44);

            --glass-strong:
                rgba(255, 255, 255, .65);

            --line:
                rgba(255, 255, 255, .90);

            --shadow:
                0 25px 75px rgba(120, 78, 135, .18);

            --glow:
                0 0 25px rgba(255, 175, 220, .40),
                0 0 55px rgba(175, 150, 255, .20);

            --hero-gradient:
                linear-gradient(
                    90deg,
                    #ff6db7,
                    #a78cf4,
                    #69d8ee,
                    #ff6db7
                );

        }


        /* =====================================================
           CHOCOLATE THEME
        ===================================================== */

        body.theme-chocolate {

            --bg-a: #321b1a;

            --bg-b: #593129;

            --bg-c: #80503b;

            --accent-1: #df795d;

            --accent-2: #bd8f64;

            --accent-3: #f0b37c;

            --accent-soft:
                rgba(224, 125, 89, .24);

            --text-main: #ffe5d2;

            --text-soft: #e5c0a7;

            --glass:
                rgba(255, 227, 207, .12);

            --glass-strong:
                rgba(255, 232, 211, .19);

            --line:
                rgba(255, 222, 199, .36);

            --shadow:
                0 25px 75px rgba(15, 5, 4, .48);

            --glow:
                0 0 25px rgba(240, 158, 111, .25),
                0 0 55px rgba(106, 61, 42, .42);

            --hero-gradient:
                linear-gradient(
                    90deg,
                    #f29f79,
                    #d27d5c,
                    #edc79a,
                    #f29f79
                );

        }


        /* =====================================================
           FRUIT THEME
        ===================================================== */

        body.theme-fruit {

            --bg-a: #fffbd8;

            --bg-b: #dfffe3;

            --bg-c: #dff6ff;

            --accent-1: #ff6d6d;

            --accent-2: #ffad3f;

            --accent-3: #61d499;

            --accent-soft:
                rgba(255, 145, 75, .21);

            --text-main: #355c4a;

            --text-soft: #648173;

            --glass:
                rgba(255, 255, 255, .50);

            --glass-strong:
                rgba(255, 255, 255, .68);

            --line:
                rgba(255, 255, 255, .88);

            --shadow:
                0 25px 75px rgba(68, 120, 82, .17);

            --glow:
                0 0 25px rgba(255, 160, 92, .28),
                0 0 55px rgba(92, 218, 145, .22);

            --hero-gradient:
                linear-gradient(
                    90deg,
                    #ff6d6d,
                    #ffae42,
                    #67c990,
                    #ff6d6d
                );

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            font-family: "Kanit", sans-serif;

            color: var(--text-main);

            overflow-x: hidden;

            background:

                radial-gradient(
                    circle at 10% 15%,
                    var(--accent-soft),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 12%,
                    rgba(158, 137, 255, .17),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(110, 222, 245, .18),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    var(--bg-a),
                    var(--bg-b),
                    var(--bg-c)
                );

            background-size: 180% 180%;

            animation:
                backgroundDrift 16s ease-in-out infinite alternate;

            transition:
                background .8s ease,
                color .6s ease;

        }


        body.theme-chocolate {

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(224, 125, 89, .20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 18%,
                    rgba(138, 85, 60, .25),
                    transparent 32%
                );

        }
                  body.theme-chocolate {

            background:

                radial-gradient(
                    circle at 10% 15%,
                    rgba(224, 125, 89, .20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 18%,
                    rgba(138, 85, 60, .25),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    var(--bg-a),
                    var(--bg-b),
                    var(--bg-c)
                );

        }


        body.theme-fruit {

            background:

                radial-gradient(
                    circle at 10% 16%,
                    rgba(255, 110, 99, .19),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 14%,
                    rgba(90, 213, 139, .22),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    var(--bg-a),
                    var(--bg-b),
                    var(--bg-c)
                );

        }


        a {

            color: inherit;

        }


        button {

            font-family: inherit;

        }


        ::selection {

            background: var(--accent-1);

            color: white;

        }


        /* =====================================================
           MAGIC BACKGROUND
        ===================================================== */

        .magic-background {

            position: fixed;

            inset: 0;

            z-index: -20;

            overflow: hidden;

            pointer-events: none;

        }


        .magic-orb {

            position: absolute;

            width: 330px;

            height: 330px;

            border-radius: 50%;

            filter: blur(85px);

            opacity: .28;

            animation:
                orbMove 18s ease-in-out infinite alternate;

        }


        .orb-1 {

            left: -90px;

            top: -80px;

            background: var(--accent-1);

        }


        .orb-2 {

            right: -110px;

            top: 35%;

            background: var(--accent-2);

            animation-delay: 4s;

        }


        .orb-3 {

            left: 35%;

            bottom: -120px;

            background: var(--accent-3);

            animation-delay: 7s;

        }


        @keyframes orbMove {

            0% {

                transform:
                    translate(0, 0)
                    scale(.9);

            }

            50% {

                transform:
                    translate(100px, -80px)
                    scale(1.35);

            }

            100% {

                transform:
                    translate(-80px, 90px)
                    scale(1.05);

            }

        }


        /* =====================================================
           SPARKLES
        ===================================================== */

        .sparkle {

            position: fixed;

            width: 4px;

            height: 4px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 7px white,
                0 0 18px var(--accent-1);

            opacity: .7;

            pointer-events: none;

            animation:
                sparkleBlink
                2s
                ease-in-out
                infinite alternate;

        }


        @keyframes sparkleBlink {

            from {

                opacity: .12;

                transform: scale(.35);

            }

            to {

                opacity: 1;

                transform: scale(1.8);

            }

        }


        /* =====================================================
           LOADING SCREEN
        ===================================================== */

        #loader {

            position: fixed;

            inset: 0;

            z-index: 99999;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            background:

                radial-gradient(
                    circle at center,
                    #ffffff55,
                    transparent 27%
                ),

                linear-gradient(
                    135deg,
                    var(--accent-1),
                    var(--accent-2)
                );

            transition:
                opacity .8s ease,
                visibility .8s ease;

        }


        #loader.finished {

            opacity: 0;

            visibility: hidden;

        }


        .loader-core {

            position: relative;

            z-index: 5;

            text-align: center;

        }


        .loader-cake {

            font-size: 92px;

            animation:
                cakePulse 1.4s
                ease-in-out
                infinite;

        }


        @keyframes cakePulse {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-2deg)
                    scale(1);

            }

            50% {

                transform:
                    translateY(-13px)
                    rotate(2deg)
                    scale(1.08);

            }

        }


        .loader-title {

            margin-top: 18px;

            font-family:
                "Pacifico",
                cursive;

            color: white;

            font-size:
                clamp(32px, 7vw, 58px);

            text-shadow:
                0 0 12px #ffffffaa,
                0 8px 20px #74486b55;

        }


        .loader-subtitle {

            margin-top: 8px;

            color: white;

            font-size: 12px;

            letter-spacing: 4px;

        }


        .loader-bar {

            width: 230px;

            height: 8px;

            margin: 25px auto 0;

            border-radius: 50px;

            background: #ffffff55;

            overflow: hidden;

        }


        .loader-progress {

            width: 0;

            height: 100%;

            background: white;

            border-radius: inherit;

            animation:
                loadingBar
                2.2s
                forwards;

        }


        @keyframes loadingBar {

            to {

                width: 100%;

            }

        }


        /* =====================================================
           LOADER BURST
        ===================================================== */

        .loader-burst {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .burst-item {

            position: absolute;

            left: 50%;

            top: 50%;

            opacity: 0;

            font-size:
                calc(
                    22px + var(--size)
                );

            animation:
                burstOut
                2.6s
                cubic-bezier(.2, .7, .15, 1)
                forwards;

            animation-delay: var(--delay);

        }


        @keyframes burstOut {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.15)
                    rotate(0deg);

            }

            14% {

                opacity: 1;

            }

            100% {

                opacity: 1;

                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1)
                    rotate(var(--rotate));

            }

        }


        /* =====================================================
           DRIZZLE CURTAIN
        ===================================================== */

        #drizzleCurtain {

            position: fixed;

            inset: -15% 0 0 0;

            z-index: 99998;

            pointer-events: none;

            transform: translateY(-115%);

            opacity: 0;

        }


        #drizzleCurtain.active {

            opacity: 1;

        }
                  #drizzleCurtain.active {

            animation:
                drizzleDown
                1.35s
                cubic-bezier(.75, .02, .2, 1)
                forwards;

        }


        #drizzleCurtain.leave {

            animation:
                drizzleLeave
                1.5s
                cubic-bezier(.65, .01, .2, 1)
                forwards;

        }


        .drizzle-layer {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,.38),
                    rgba(255,255,255,.10)
                );

            backdrop-filter: blur(13px);

        }


        .drizzle-wave {

            position: absolute;

            top: 0;

            width: 100%;

            height: 35%;

            border-radius:
                0 0 50% 50% /
                0 0 35% 35%;

            background:
                linear-gradient(
                    180deg,
                    #ffffffee,
                    #ffffff75,
                    transparent
                );

            box-shadow:
                0 10px 45px #ffffff55;

        }


        .drip {

            position: absolute;

            left: var(--left);

            top: 0;

            width: var(--width);

            height: var(--height);

            border-radius:
                0 0 40px 40px;

            background:
                linear-gradient(
                    180deg,
                    #ffffffe8,
                    #ffffff66
                );

            box-shadow:
                0 5px 20px #ffffff44;

        }


        @keyframes drizzleDown {

            from {

                transform:
                    translateY(-115%);

            }

            to {

                transform:
                    translateY(0);

            }

        }


        @keyframes drizzleLeave {

            from {

                transform:
                    translateY(0);

            }

            to {

                transform:
                    translateY(-120%);

            }

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .topbar {

            position: fixed;

            top: 18px;

            left: 50%;

            transform:
                translateX(-50%);

            width:
                min(94%, 1180px);

            z-index: 5000;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            padding: 13px 20px;

            border:
                1px solid var(--line);

            border-radius: 50px;

            background:
                var(--glass);

            backdrop-filter:
                blur(22px);

            box-shadow:
                var(--shadow),
                inset 0 1px 0 #ffffffcc;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 8px;

            font-family:
                "Pacifico",
                cursive;

            font-size: 22px;

            color:
                var(--accent-1);

            text-shadow:
                0 0 16px var(--accent-soft);

            white-space: nowrap;

        }


        .nav-links {

            display: flex;

            list-style: none;

            gap: 22px;

        }


        .nav-links a {

            position: relative;

            text-decoration: none;

            font-size: 14px;

            transition: .3s;

        }


        .nav-links a:hover {

            color:
                var(--accent-1);

        }


        .nav-links a::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -6px;

            width: 0;

            height: 2px;

            transform:
                translateX(-50%);

            border-radius: 50px;

            background:
                var(--accent-1);

            transition: .3s;

        }


        .nav-links a:hover::after {

            width: 100%;

        }


        /* =====================================================
           THEME SWITCHER
        ===================================================== */

        .theme-switcher {

            position: fixed;

            right: 20px;

            top: 95px;

            z-index: 5001;

            display: flex;

            flex-direction: column;

            gap: 8px;

            padding: 10px;

            border:
                1px solid var(--line);

            border-radius: 24px;

            background:
                var(--glass);

            backdrop-filter:
                blur(18px);

            box-shadow:
                var(--shadow);

        }


        .theme-button {

            position: relative;

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            cursor: pointer;

            background:
                var(--glass-strong);

            box-shadow:
                inset 0 1px 0 #ffffffaa;

            font-size: 19px;

            transition: .3s;

        }


        .theme-button:hover {

            transform:
                translateX(-5px)
                scale(1.08);

        }


        .theme-button.active {

            box-shadow:
                0 0 0 2px
                var(--accent-1),

                0 0 22px
                var(--accent-soft);

        }


        .theme-tooltip {

            position: absolute;

            right: 52px;

            top: 50%;

            transform:
                translateY(-50%)
                translateX(5px);

            padding: 6px 10px;

            border-radius: 10px;

            background:
                rgba(30,20,40,.80);

            color: white;

            font-size: 11px;

            white-space: nowrap;

            opacity: 0;

            pointer-events: none;

            transition: .25s;

        }


        .theme-button:hover
        .theme-tooltip {

            opacity: 1;

            transform:
                translateY(-50%)
                translateX(0);

        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {

            position: relative;

            min-height: 100vh;

            padding:
                155px 7% 185px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            text-align: center;

        }


        .hero-stage {

            position: absolute;

            left: 50%;

            top: 51%;

            width:
                min(720px, 90vw);

            height:
                min(720px, 90vw);

            transform:
                translate(-50%, -50%);

            pointer-events: none;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.50);

            box-shadow:
                0 0 80px
                var(--accent-soft),

                inset 0 0 80px
                rgba(255,255,255,.20);

            animation:
                stageRotate
                45s
                linear
                infinite;

        }


        .hero-stage::before {

            content: "";

            position: absolute;

            inset: 35px;

            border-radius: 50%;

            border:
                1px dashed
                rgba(255,255,255,.55);

        }


        .hero-stage::after {

            content: "";

            position: absolute;

            inset: 90px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255,255,255,.38);

        }


        @keyframes stageRotate {

            from {

                transform:
                    translate(-50%, -50%)
                    rotate(0deg);

            }

            to {

                transform:
                    translate(-50%, -50%)
                    rotate(360deg);

            }

        }


        .hero-content {

            position: relative;

            z-index: 5;

            max-width: 850px;

        }


        .hero-badge {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding: 8px 17px;

            border:
                1px solid var(--line);

            border-radius: 50px;

            background:
                var(--glass);

            backdrop-filter:
                blur(14px);

            font-size: 12px;

            letter-spacing: 2px;

            box-shadow:
                var(--shadow);

            animation:
                floatBadge
                4s
                ease-in-out
                infinite;

        }


        @keyframes floatBadge {

            0%,
            100% {

                transform:
                    translateY(0);

            }

            50% {

                transform:
                    translateY(-8px);

            }

        }


        .hero-title {

            margin-top: 25px;

            font-family:
                "Pacifico",
                cursive;

            font-size:
                clamp(48px, 10vw, 112px);

            line-height: 1.12;

            background:
                var(--hero-gradient);

            background-size: 300% 300%;

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            animation:
                gradientText
                8s
                ease
                infinite;

            filter:
                drop-shadow(
                    0 12px 22px
                    rgba(150,90,160,.18)
                );

        }


        @keyframes gradientText {

            0% {

                background-position: 0% 50%;

            }

            50% {

                background-position: 100% 50%;

            }

            100% {

                background-position: 0% 50%;

            }

        }


        .hero-subtitle {

            margin-top: 22px;

            font-size:
                clamp(16px, 2.5vw, 25px);

            font-weight: 400;

            letter-spacing: 1px;

        }


        .hero-description {

            max-width: 620px;

            margin:
                18px auto 0;

            color:
                var(--text-soft);

            font-size: 14px;

            line-height: 2;

        }


        .hero-actions {

            display: flex;

            align-items: center;

            justify-content: center;

            flex-wrap: wrap;

            gap: 14px;

            margin-top: 35px;

        }


        .primary-button,
        .secondary-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            padding: 13px 24px;

            border-radius: 50px;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;

            transition:
                transform .3s,
                box-shadow .3s;

        }


        .primary-button {

            border:
                1px solid
                rgba(255,255,255,.70);

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent-1),
                    var(--accent-2)
                );

            box-shadow:
                0 10px 25px
                var(--accent-soft);

        }


        .secondary-button {

            border:
                1px solid var(--line);

            color:
                var(--text-main);

            background:
                var(--glass);

            backdrop-filter:
                blur(12px);

        }


        .primary-button:hover,
        .secondary-button:hover {

            transform:
                translateY(-5px)
                scale(1.03);

            box-shadow:
                var(--glow);

        }


        /* =====================================================
           RESPONSIVE NAV
        ===================================================== */

        @media (max-width: 700px) {

            .topbar {

                padding:
                    12px 15px;

            }


            .logo {

                font-size: 17px;

            }


            .nav-links {

                gap: 10px;

            }


            .nav-links a {

                font-size: 11px;

            }


            .theme-switcher {

                right: 10px;

                top: 88px;

                padding: 7px;

            }


            .theme-button {

                width: 35px;

                height: 35px;

                font-size: 16px;

            }


            .hero {

                padding:
                    145px 22px 130px;

            }


            .hero-description {

                font-size: 13px;

            }


            .primary-button,
            .secondary-button {

                padding:
                    11px 18px;

                font-size: 12px;

            }

        }
                  /* =========================================
           HERO CONTENT
        ========================================= */

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 950px;
            transition: transform .16s ease-out;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border: 1px solid var(--line);
            border-radius: 50px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            color: var(--accent-1);
            letter-spacing: 4px;
            font-size: 12px;
            box-shadow:
                inset 0 1px 0 #ffffffaa,
                0 10px 30px var(--accent-soft);
        }

        .chapter-badge {
            margin: 17px auto 2px;
            width: fit-content;
            padding: 6px 14px;
            border-radius: 50px;
            border: 1px solid var(--line);
            background: var(--glass);
            backdrop-filter: blur(12px);
            color: var(--text-soft);
            font-size: 11px;
            letter-spacing: 2px;
        }

        .hero-title {
            position: relative;
            margin: 11px 0 8px;
            font-family: "Pacifico", cursive;
            font-size: clamp(50px, 10vw, 110px);
            line-height: 1.2;
            background: var(--hero-gradient);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleGradient 8s linear infinite;
            filter: drop-shadow(
                0 12px 18px rgba(130,80,140,.13)
            );
        }

        .hero-title::before {
            content: "";
            position: absolute;
            inset: -18px -35px;
            border-radius: 80px;
            background: linear-gradient(
                90deg,
                transparent,

          /* =========================================

========================================= */

.balloon-layer {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    overflow: hidden;
}

.balloon {
    position: absolute;
    bottom: -150px;
    width: 72px;
    height: 90px;
    cursor: pointer;
    pointer-events: auto;
    opacity: 0;
    animation: balloonRise var(--duration) linear forwards;
}

.balloon-body {
    position: relative;
    width: 62px;
    height: 74px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% 50% 48% 48% 45%;
    border: 2px solid #ffffff88;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffffffaa,
            transparent 20%
        ),
        linear-gradient(
            145deg,
            var(--balloon-a),
            var(--balloon-b)
        );

    box-shadow:
        0 12px 25px rgba(70,40,80,.20),
        inset 0 0 18px #ffffff25;

    transition: .2s;
}

.balloon-body::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -7px;
    transform: translateX(-50%) rotate(45deg);
    width: 13px;
    height: 13px;
    background: var(--balloon-b);
}

.balloon-icon {
    font-size: 25px;
    z-index: 2;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.12));
}

.balloon-string {
    width: 1px;
    height: 55px;
    margin: -1px auto 0;
    background: linear-gradient(
        transparent,
        #ffffffaa
    );
}

.balloon:hover .balloon-body {
    transform: scale(1.12) rotate(-4deg);

    box-shadow:
        0 0 30px var(--accent-soft),
        inset 0 0 20px #ffffff38;
}

@keyframes balloonRise {
    0% {
        transform:
            translateY(0)
            translateX(0)
            rotate(-6deg);
        opacity: 0;
    }

    10% {
        opacity: .95;
    }

    45% {
        transform:
            translateY(-50vh)
            translateX(35px)
            rotate(7deg);
    }

    75% {
        transform:
            translateY(-82vh)
            translateX(-30px)
            rotate(-5deg);
    }

    100% {
        transform:
            translateY(-125vh)
            translateX(20px)
            rotate(6deg);
        opacity: 0;
    }
}


/* =========================================
   BALLOON BURST
========================================= */

.balloon-burst {
    position: fixed;
    z-index: 9997;
    pointer-events: none;
    font-size: 21px;

    animation:
        balloonBurst
        1.1s
        cubic-bezier(.15,.7,.2,1)
        forwards;
}

@keyframes balloonBurst {
    0% {
        opacity: 1;
        transform:
            translate(0,0)
            scale(.4)
            rotate(0deg);
    }

    100% {
        opacity: 0;
        transform:
            translate(var(--bx),var(--by))
            scale(1.45)
            rotate(var(--br));
    }
}

.burst-ring {
    position: fixed;
    z-index: 9996;
    width: 20px;
    height: 20px;
    border: 3px solid white;
    border-radius: 50%;
    pointer-events: none;

    box-shadow:
        0 0 20px var(--accent-soft);

    animation:
        ringBurst
        .7s
        ease-out
        forwards;
}

@keyframes ringBurst {
    from {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(.2);
    }

    to {
        opacity: 0;
        transform:
            translate(-50%,-50%)
            scale(5);
    }
}


/* =========================================
   CLICK RAIN
========================================= */

.click-sweet {
    position: fixed;
    z-index: 9990;
    pointer-events: none;
    font-size: 23px;

    animation:
        clickRain
        1.7s
        cubic-bezier(.2,.7,.2,1)
        forwards;
}

@keyframes clickRain {
    0% {
        opacity: 1;

        transform:
            translate(var(--x),-20px)
            rotate(0deg)
            scale(.65);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                calc(var(--x) + var(--drift)),
                260px
            )
            rotate(var(--rotate))
            scale(1.15);
    }
}


/* =========================================
   CURSOR
========================================= */

.cursor-glow {
    position: fixed;
    left: 0;
    top: 0;
    width: 160px;
    height: 160px;
    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            var(--accent-soft),
            transparent 70%
        );

    transform: translate(-50%,-50%);
    pointer-events: none;
    z-index: 9998;
    mix-blend-mode: screen;
    filter: blur(5px);
}

        transform 1s cubic-bezier(.2,.7,.2,1);

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

        /* =========================================================

        function randomItem(array) {

            return array[
                Math.floor(
                    Math.random() *
                    array.length
                )
            ];

        }


        /* =========================================================
           THEME SWITCH
        ========================================================= */

        const themeButtons =
            document.querySelectorAll(
                ".theme-button"
            );


        themeButtons.forEach(
            (button) => {
                          button.addEventListener(

            "click",

            (event) => {

                event.stopPropagation();

                currentTheme =
                    button.dataset.theme;


                document.body.classList.remove(

                    "theme-chocolate",

                    "theme-fruit"

                );


                if (

                    currentTheme ===

                    "chocolate"

                ) {

                    document.body.classList.add(

                        "theme-chocolate"

                    );

                }


                if (

                    currentTheme ===

                    "fruit"

                ) {

                    document.body.classList.add(

                        "theme-fruit"

                    );

                themeButtons.forEach(

                    (item) => {

                        item.classList.remove(

                        );

                    }

                );


                button.classList.add(

                    "active"

                );


                document.getElementById(

                    "logoText"

                ).textContent =

                    themes[

                updateTimelineIcons();

                updateBottomPile();

                updateHeroShelf();

/* =========================================================
   TIMELINE ICONS
========================================================= */

function updateTimelineIcons() {

    const icons =

        document.querySelectorAll(

            ".timeline-icon"

        );


    const data =

        themes[

            currentTheme

        ].icons;


    icons.forEach(

        (icon, index) => {

            icon.textContent =

                data[

                    index %

                    data.length

                ];

        }

    );

}


/* =========================================================
   HERO SHELF
========================================================= */

function updateHeroShelf() {

    const shelf =

        document.getElementById(

            "heroShelfItems"

        );


    shelf.innerHTML = "";


    themes[

        currentTheme

    ].shelf.forEach(

        (item) => {

            const span =

                document.createElement(

                    "span"

                );


            span.textContent =

                item;


            shelf.appendChild(

                span

            );

        }

    );

}


/* =========================================================
   BOTTOM PILE
========================================================= */

function updateBottomPile() {

    const pile =

        document.getElementById(

            "bottomPile"

        );


    pile.innerHTML = "";


    themes[

        currentTheme

    ].pile.forEach(

        (item) => {

            const span =

                document.createElement(

                    "span"

                );


            span.className =

                "pile-item";


            span.textContent =

                item;


            pile.appendChild(

                span

            );

        }

    );

}


/* =========================================================
   FLOATING SWEETS
========================================================= */

function createFloatingSweet() {

    const sweet =

        document.createElement(

            "span"

        );


    sweet.className =

        "floating-sweet";


    sweet.textContent =

        randomItem(

            themes[

                currentTheme

            ].floating

        );


    sweet.style.left =

        Math.random() * 100 +

        "%";


    sweet.style.fontSize =

        (

            18 +

            Math.random() * 28

        ) +

        "px";
                  sweet.style.setProperty(
                "--sway",
                (
                    Math.random() * 160 -
                    80
                ) +
                "px"
            );

            sweet.style.animationDuration =
                (
                    12 +
                    Math.random() * 18
                ) +
                "s";


            document
                .querySelector(
                    ".magic-background"
                )
                .appendChild(
                    sweet
                );


            setTimeout(
                () => {

                    sweet.remove();

                },
                32000
            );

        }


        function createFloatingSweets() {

            for (
                let i = 0;
                i < 60;
                i++
            ) {

                setTimeout(
                    () => {

                        createFloatingSweet();

                    },
                    i * 200
                );

            }

        }


        function restartFloatingSweets() {

            document
                .querySelectorAll(
                    ".floating-sweet"
                )
                .forEach(
                    (item) =>
                        item.remove()
                );


            createFloatingSweets();

        }


        /* =========================================================
           SPARKLES
        ========================================================= */

        function createSparkles() {

            const layer =
                document.querySelector(
                    ".magic-background"
                );


            for (
                let i = 0;
                i < 70;
                i++
            ) {

                const star =
                    document.createElement(
                        "span"
                    );


                star.className =
                    "sparkle";


                star.style.left =
                    Math.random() * 100 +
                    "%";


                star.style.top =
                    Math.random() * 100 +
                    "%";


                star.style.animationDuration =
                    (
                        1 +
                        Math.random() * 3
                    ) +
                    "s";


                star.style.animationDelay =
                    Math.random() * 4 +
                    "s";


                layer.appendChild(
                    star
                );

            }

        }


        /* =========================================================
           BALLOON CREATOR
        ========================================================= */

        function createBalloon() {

            const info =
                randomItem(
                    themes[
                        currentTheme
                    ].balloons
                );


            const balloon =
                document.createElement(
                    "div"
                );


            balloon.className =
                "balloon";


            balloon.style.left =
                (
                    3 +
                    Math.random() * 94
                ) +
                "%";


            balloon.style.setProperty(
                "--duration",
                (
                    9 +
                    Math.random() * 7
                ) +
                "s"
            );


            balloon.style.setProperty(
                "--balloon-a",
                info.a
            );


            balloon.style.setProperty(
                "--balloon-b",
                info.b
            );


            balloon.innerHTML = `

                <div class="balloon-body">

                    <span class="balloon-icon">

                        ${info.icon}

                    </span>

                </div>

                <div class="balloon-string"></div>

            `;


            balloon.addEventListener(
                "click",
                (event) => {

                    event.stopPropagation();


                    popBalloon(
                        balloon,
                        event
                    );

                }
            );


            document
                .getElementById(
                    "balloonLayer"
                )
                .appendChild(
                    balloon
                );

        }
                          balloon
        );

        setTimeout(
            () => {

                balloon.remove();

            },
            18000
        );

    }


    /* =========================================================
       BALLOON SPAWN
    ========================================================= */

    function spawnBalloons() {

        const amount =
            3 +
            Math.floor(
                Math.random() * 2
            );


        for (
            let i = 0;
            i < amount;
            i++
        ) {

            setTimeout(
                () => {

                    createBalloon();

                },
                i * 280
            );

        }

    }


    /* =========================================================
       BALLOON POP
    ========================================================= */

    function popBalloon(
        balloon,
        event
    ) {

        const rect =
            balloon.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const ring =
            document.createElement(
                "div"
            );


        ring.className =
            "burst-ring";


        ring.style.left =
            centerX + "px";


        ring.style.top =
            centerY + "px";


        document.body.appendChild(
            ring
        );


        const candySet =
            themes[
                currentTheme
            ].burst;


        for (
            let i = 0;
            i < 18;
            i++
        ) {

            const particle =
                document.createElement(
                    "span"
                );


            particle.className =
                "balloon-burst";


            particle.textContent =
                randomItem(
                    candySet
                );


            particle.style.left =
                centerX + "px";


            particle.style.top =
                centerY + "px";


            particle.style.setProperty(
                "--bx",
                (
                    Math.random() *
                    260 -
                    130
                ) +
                "px"
            );


            particle.style.setProperty(
                "--by",
                (
                    Math.random() *
                    260 -
                    130
                ) +
                "px"
            );


            particle.style.setProperty(
                "--br",
                (
                    Math.random() *
                    540 -
                    270
                ) +
                "deg"
            );


            document.body.appendChild(
                particle
            );


            setTimeout(
                () => {

                    particle.remove();

                },
                1150
            );

        }


        balloon.remove();


        setTimeout(
            () => {

                ring.remove();

            },
            750
        );

    }


    /* =========================================================
       CLICK CANDY RAIN
    ========================================================= */

    document.addEventListener(
        "click",
        (event) => {

            if (
                event.target.closest(
                    ".theme-switcher"
                )
            ) {

                return;

            }


            for (
                let i = 0;
                i < 18;
                i++
            ) {

                setTimeout(
                    () => {

                        const candy =
                            document.createElement(
                                "span"
                            );


                        candy.className =
                            "click-sweet";


                        candy.textContent =
                            randomItem(
                                themes[
                                    currentTheme
                                ].click
                            );


                        candy.style.left =
                            (
                                event.clientX +
                                Math.random() *
                                150 -
                                75
                            ) +
                            "px";


                        candy.style.top =
                            event.clientY +
                            "px";


                        candy.style.setProperty(
                            "--x",
                            (
                                Math.random() *
                                100 -
                                50
                            ) +
                            "px"
                        );


                        candy.style.setProperty(
                            "--drift",
                            (
                                Math.random() *
                                120 -
                                60
                            ) +
                            "px"
                        );


                        candy.style.setProperty(
                            "--rotate",
                            (
                                Math.random() *
                                360
                            ) +
                            "deg"
                        );


                        document.body.appendChild(
                            candy
                        );


                        setTimeout(
                            () => {

                                candy.remove();

                            },
                            1800
                        );

                    },
                    i * 45
                );

            }

        }
    );


    /* =========================================================
       CURSOR GLOW
    ========================================================= */

    const cursorGlow =
        document.getElementById(
            "cursorGlow"
        );


    document.addEventListener(
        "mousemove",
        (event) => {

            cursorGlow.style.left =
                event.clientX + "px";


            cursorGlow.style.top =
                event.clientY + "px";

        }
    );


    /* =========================================================
       HERO PARALLAX
    ========================================================= */

    const heroContent =
        document.getElementById(
            "heroContent"
        );


    document.addEventListener(
        "mousemove",
        (event) => {

            const x =
                event.clientX /
                window.innerWidth -
                .5;


            const y =
                event.clientY /
                window.innerHeight -
                .5;


            heroContent.style.transform =
                `
                translate(
                    ${x * 13}px,
                    ${y * 13}px
                )
                `;

        }
    );


    /* =========================================================
       3D CARD TILT
    ========================================================= */

    document
        .querySelectorAll(
            ".story-card"
        )
        .forEach(
            (card) => {

                const light =
                    card.querySelector(
                        ".card-light"
                    );


                const image =
                    card.querySelector(
                        ".story-image"
                    );


                card.addEventListener(
                    "mousemove",
                    (event) => {

                        const rect =
                            card.getBoundingClientRect();


                        const x =
                            event.clientX -
                            rect.left;


                        const y =
                            event.clientY -
                            rect.top;


                        const px =
                            x /
                            rect.width;


                        const py =
                            y /
                            rect.height;


                        const rotateX =
                            (
                                py -
                                .5
                            ) *
                            -16;


                        const rotateY =
                            (
                                px -
                                .5
                            ) *
                            16;


                        card.style.transform =
                            `
                            perspective(1200px)
                            rotateX(
                                ${rotateX}deg
                            )
                            rotateY(
                                ${rotateY}deg
                            )
                            translateY(-8px)
                            scale(1.025)
                            `;


                        light.style.left =
                            x + "px";


                        light.style.top =
                            y + "px";


                        const moveX =
                            (
                                px -
                                .5
                            ) *
                            8;


                        const moveY =
                            (
                                py -
                                .5
                            ) *
                            8;


                        image.style.transform =
                            `
                            scale(1.09)
                            translate(
                                ${moveX}px,
                                ${moveY}px
                            )
                            `;

                    }
                );


                card.addEventListener(
                    "mouseleave",
                    () => {

                        card.style.transform =
                            `
                            perspective(1200px)
                            rotateX(0deg)
                            rotateY(0deg)
                            translateY(0)
                            scale(1)
                            `;


                        image.style.transform =
                            "scale(1)";

                    }
                );

            }
        );


    /* =========================================================
       SCROLL REVEAL
    ========================================================= */

    const revealElements =
        document.querySelectorAll(
            ".reveal"
        );


    const revealObserver =
        new IntersectionObserver(
            (entries) => {

                entries.forEach(
                    (entry) => {

                        if (
                            entry.isIntersecting
                        ) {

                            entry.target.classList.add(
                                "show"
                            );


                            revealObserver.unobserve(
                                entry.target
                            );

                        }

                    }
                );

            },
            {
                threshold:
                    .12
            }
        );


    revealElements.forEach(
        (element) => {

            revealObserver.observe(
                element
            );

        }
    );


    /* =========================================================
       TOP BUTTON
    ========================================================= */

    const topButton =
        document.getElementById(
            "topButton"
        );


    window.addEventListener(
        "scroll",
        () => {

            if (
                window.scrollY >
                500
            ) {

                topButton.classList.add(
                    "show"
                );

            } else {

                topButton.classList.remove(
                    "show"
                );

            }

        }
    );


    topButton.addEventListener(
        "click",
        () => {

            window.scrollTo(
                {
                    top:
                        0,

                    behavior:
                        "smooth"
                }
            );

        }
    );


    /* =========================================================
       LOADER BURST
    ========================================================= */

    function createLoaderBurst() {

        const burst =
            document.getElementById(
                "loaderBurst"
            );


        const items =
            themes[
                currentTheme
            ].burst;


        for (
            let i = 0;
            i < 24;
            i++
        ) {

            const item =
                document.createElement(
                    "span"
                );


            item.className =
                "burst-item";


            item.textContent =
                randomItem(
                    items
                );


            const angle =
                (
                    Math.PI *
                    2 *
                    i
                ) /
                24;


            const distance =
                170 +
                Math.random() *
                430;


            const x =
                Math.cos(angle) *
                distance;


            const y =
                Math.sin(angle) *
                distance;


            item.style.setProperty(
                "--x",
                x + "px"
            );


            item.style.setProperty(
                "--y",
                y + "px"
            );


            item.style.setProperty(
                "--rotate",
                (
                    Math.random() *
                    540 -
                    270
                ) +
                "deg"
            );


            item.style.setProperty(
                "--size",
                (
                    Math.random() *
                    18
                ) +
                "px"
            );


            item.style.setProperty(
                "--delay",
                (
                    1.85 +
                    Math.random() *
                    .35
                ) +
                "s"
            );


            burst.appendChild(
                item
            );

        }

    }


    /* =========================================================
       DRIZZLE CREATOR
    ========================================================= */

    function createDrizzle() {

        const curtain =
            document.getElementById(
                "drizzleCurtain"
            );


        for (
            let i = 0;
            i < 28;
            i++
        ) {

            const drip =
                document.createElement(
                    "div"
                );


            drip.className =
                "drip";


            drip.style.setProperty(
                "--left",
                Math.random() * 100 +
                "%"
            );


            drip.style.setProperty(
                "--width",
                (
                    18 +
                    Math.random() * 80
                ) +
                "px"
            );


            drip.style.setProperty(
                "--height",
                (
                    80 +
                    Math.random() * 280
                ) +
                "px"
            );


            curtain.appendChild(
                drip
            );

        }

    }


    /* =========================================================
       START
    ========================================================= */

    window.addEventListener(
        "load",
        () => {

            createLoaderBurst();

            createDrizzle();

            createSparkles();

            updateBottomPile();

            updateHeroShelf();


            setTimeout(
                () => {

                    const curtain =
                        document.getElementById(
                            "drizzleCurtain"
                        );


                    curtain.classList.add(
                        "active"
                    );


                    setTimeout(
                        () => {

                            curtain.classList.remove(
                                "active"
                            );


                            curtain.classList.add(
                                "leave"
                            );


                            setTimeout(
                                () => {

                                    document
                                        .getElementById(
                                            "loader"
                                        )
                                        .classList
                                        .add(
                                            "finished"
                                        );


                                    createFloatingSweets();

                                    spawnBalloons();


                                },
                                950
                            );

                        },
                        1300
                    );

                },
                2450
            );

        }
    );


    /* =========================================================
       CONTINUOUS BALLOONS
    ========================================================= */

    setInterval(
        () => {

            spawnBalloons();

        },
        5000
    );


</script>
